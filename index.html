<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RoyalSocial App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0914;
            --card-bg: #181124;
            --input-bg: #09050e;
            --accent-purple: #7000ff;
            --accent-pink: #d946ef;
            --text-color: #ffffff;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .balance-title {
            font-size: 12px;
            color: var(--text-muted);
        }

        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        .charge-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .section-title {
            font-size: 14px;
            margin-bottom: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(217, 70, 239, 0.15);
            color: var(--accent-pink);
        }

        .card-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            color: white;
            margin-bottom: 12px;
            outline: none;
            text-align: center;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .asia-btn {
            background: linear-gradient(90deg, #ec4899, #d946ef);
        }

        .rafidain-btn {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .copy-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--input-bg);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="balance-title">الرصيد المتاح</div>
            <div class="balance-amount">$0.0000</div>
        </div>
        <button class="charge-btn">+ شحن الرصيد</button>
    </div>

    <div class="section-title">💳 طرق شحن الرصيد المتاحة</div>

    <!-- كارت آسيا سيل -->
    <div class="card">
        <span class="badge">شحن آلي</span>
        <div class="card-header">💳 كارت آسيا سيل</div>
        <div class="card-desc">قم بإدخال كود كارت شحن آسيا سيل للتعبئة:</div>
        <input type="number" id="asiaCardInput" placeholder="أدخل رقم الكارت هنا...">
        <button onclick="sendAsiaCard()" class="submit-btn asia-btn">تأكيد شحن الكارت</button>
    </div>

    <!-- ماستر كارد الرافدين -->
    <div class="card">
        <span class="badge">تحويل مباشر</span>
        <div class="card-header">💳 ماستر كارد الرافدين</div>
        <div class="card-desc">حول المبلغ إلى رقم البطاقة الموضح بالأسفل:</div>
        <div class="copy-box">
            <span id="cardNumber">7168843873</span>
            <button onclick="copyNumber()" class="copy-btn">📋 نسخ الرقم</button>
        </div>
        <input type="text" id="rafidainReceiptInput" placeholder="أدخل رقم الوصل أو اسم المحول...">
        <button onclick="sendRafidainReceipt()" class="submit-btn rafidain-btn">إرسال إشعار التحويل 🚀</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        function copyNumber() {
            navigator.clipboard.writeText("7168843873");
            alert("تم نسخ رقم البطاقة بنجاح! 📋");
        }

        function sendAsiaCard() {
            const cardCode = document.getElementById('asiaCardInput').value.trim();
            if (!cardCode) {
                alert("يرجى إدخال رقم الكارت أولاً!");
                return;
            }

            if (tg) {
                const user = tg.initDataUnsafe?.user || {};
                const data = {
                    action: "charge_asia",
                    card_code: cardCode,
                    user_id: user.id || "غير معروف",
                    username: user.username || "بدون يوزر",
                    first_name: user.first_name || "مستخدم"
                };
                tg.sendData(JSON.stringify(data));
                alert("تم إرسال الكارت إلى الأدمن بنجاح! ✅\nسيتم التحقق وإضافة الرصيد لحسابك.");
                tg.close();
            } else {
                alert("يرجى فتح التطبيق من داخل التليجرام ليعمل الشحن!");
            }
        }

        function sendRafidainReceipt() {
            const receiptCode = document.getElementById('rafidainReceiptInput').value.trim();
            if (!receiptCode) {
                alert("يرجى إدخال رقم الوصل أو الاسم أولاً!");
                return;
            }

            if (tg) {
                const user = tg.initDataUnsafe?.user || {};
                const data = {
                    action: "charge_rafidain",
                    receipt: receiptCode,
                    user_id: user.id || "غير معروف",
                    username: user.username || "بدون يوزر",
                    first_name: user.first_name || "مستخدم"
                };
                tg.sendData(JSON.stringify(data));
                alert("تم إرسال إشعار التحويل إلى الأدمن بنجاح! ✅\nسيتم التحقق منه وتفعيل الرصيد.");
                tg.close();
            } else {
                alert("يرجى فتح التطبيق من داخل التليجرام ليعمل الشحن!");
            }
        }
    </script>
</body>
</html>
