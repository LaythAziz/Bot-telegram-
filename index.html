<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيرفكت فولو - خدمات السوشيال ميديا</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f17;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding-bottom: 90px;
        }
        .custom-card {
            background: rgba(22, 27, 34, 0.85);
            border: 1px solid rgba(48, 54, 61, 0.6);
            backdrop-filter: blur(12px);
        }
        .fade-in {
            animation: fadeIn 0.25s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-3">

    <!-- بطاقة حساب المستخدم العلوية -->
    <div class="custom-card p-4 rounded-2xl mb-4 shadow-xl">
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center font-bold text-amber-400">
                    L
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span id="username" class="font-bold text-sm">ليث عزيز</span>
                        <span class="text-xs">🚩</span>
                    </div>
                    <span class="text-[10px] text-slate-400 font-mono">v36_5</span>
                </div>
            </div>
            <span class="text-xs bg-amber-500/10 text-amber-400 p-1.5 rounded-lg">👑</span>
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
            <div>
                <span class="block text-[10px] text-slate-400">الرصيد المتاح</span>
                <span id="userBalance" class="font-black text-amber-400 text-lg">$4.07</span>
            </div>
            <button onclick="switchTab('wallet')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs py-2 px-4 rounded-xl transition-all shadow-lg shadow-amber-500/20">
                + شحن الرصيد
            </button>
        </div>
    </div>

    <!-- حاوية محتوى الصفحات -->
    <div id="appContent" class="fade-in"></div>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 right-0 left-0 bg-[#0d1117]/95 border-t border-slate-800 backdrop-blur-xl py-2 px-4 flex justify-between items-center text-[11px] text-slate-400 z-50">
        <button onclick="switchTab('more')" id="nav-more" class="flex flex-col items-center gap-1 hover:text-amber-400 transition-all">
            <span class="text-base">☰</span>
            <span>المزيد</span>
        </button>
        <button onclick="switchTab('notifications')" id="nav-notifications" class="flex flex-col items-center gap-1 hover:text-amber-400 transition-all relative">
            <span class="absolute -top-1 right-1 bg-amber-500 text-slate-950 text-[9px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center">1</span>
            <span class="text-base">🔔</span>
            <span>الإشعارات</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center gap-1 hover:text-amber-400 transition-all">
            <span class="text-base">💳</span>
            <span>شحن</span>
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center gap-1 hover:text-amber-400 transition-all">
            <span class="text-base">📋</span>
            <span>طلباتي</span>
        </button>
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-amber-400 font-bold">
            <span class="text-base">🏠</span>
            <span>الرئيسية</span>
        </button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let appData = {
            balance: 4.07,
            orders: [
                { id: "#119320136", service: "لايكات إنستغرام ريلز + بوست", status: "اكتمل طلبك", time: "الآن" }
            ],
            notifications: [
                { title: "أهلاً بك في المتجر", desc: "تم تفعيل نظام الرشق الحقيقي بنجاح.", time: "الآن" }
            ]
        };

        function updateUI() {
            document.getElementById('userBalance').innerText = '$' + appData.balance.toFixed(2);
        }

        function switchTab(tab) {
            document.querySelectorAll('nav button').forEach(b => b.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition-all");
            document.getElementById('nav-' + tab).className = "flex flex-col items-center gap-1 text-amber-400 font-bold";

            let content = document.getElementById('appContent');
            content.className = "fade-in";

            if (tab === 'home') renderHome();
            else if (tab === 'orders') renderOrders();
            else if (tab === 'wallet') renderWallet();
            else if (tab === 'notifications') renderNotifications();
            else if (tab === 'more') renderMore();
        }

        // الصفحة الرئيسية للأقسام
        function renderHome() {
            document.getElementById('appContent').innerHTML = `
                <div class="space-y-2.5">
                    <div onclick="openCategory('instagram')" class="custom-card p-3.5 rounded-xl cursor-pointer hover:border-amber-500/50 transition-all flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-lg">🔽</span>
                            <div>
                                <h3 class="font-bold text-xs text-slate-200">متابعين انستغرام - ضمان وتعويض</h3>
                                <span class="text-[10px] text-slate-400">1 خدمة نشطة</span>
                            </div>
                        </div>
                        <span class="text-xl bg-pink-500/10 p-2 rounded-xl">📸</span>
                    </div>

                    <div onclick="openCategory('instagram_likes')" class="custom-card p-3.5 rounded-xl cursor-pointer hover:border-amber-500/50 transition-all flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-lg">🔽</span>
                            <div>
                                <h3 class="font-bold text-xs text-slate-200">أنستغرام - لايكات ريلز + بوست</h3>
                                <span class="text-[10px] text-slate-400">7 خدمات</span>
                            </div>
                        </div>
                        <span class="text-xl bg-pink-500/10 p-2 rounded-xl">📸</span>
                    </div>

                    <div onclick="openCategory('telegram_reactions')" class="custom-card p-3.5 rounded-xl cursor-pointer hover:border-blue-500/50 transition-all flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <span class="text-lg">🔽</span>
                            <div>
                                <h3 class="font-bold text-xs text-slate-200">تليكرام تفاعلات ايجابية 👍❤️🔥</h3>
                                <span class="text-[10px] text-slate-400">مجاني • الأكثر طلباً</span>
                            </div>
                        </div>
                        <span class="text-xl bg-blue-500/10 p-2 rounded-xl">✈️</span>
                    </div>
                </div>
            `;
        }

        // تفاصيل الخدمات الحقيقية داخل القسم
        function openCategory(cat) {
            document.getElementById('appContent').innerHTML = `
                <div class="flex items-center gap-2 mb-3">
                    <button onclick="switchTab('home')" class="bg-slate-800 px-3 py-1 rounded-lg text-xs">⬅ رجوع</button>
                    <h2 class="font-bold text-xs">قائمة الخدمات المتاحة</h2>
                </div>
                <div class="custom-card p-4 rounded-xl mb-3 border-l-4 border-l-amber-500">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-slate-200">لايكات إنستغرام ريلز + بوست - سرعة عالية</span>
                        <span class="text-[9px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full">✨ مضمون</span>
                    </div>
                    <div class="flex justify-between items-center text-[11px] text-amber-400 font-bold mb-3">
                        <span>$0.25 <span class="text-[10px] text-slate-400 font-normal">لكل 1000</span></span>
                        <span class="text-[10px] text-slate-400">⏱️ فوري • #807</span>
                    </div>
                    <button onclick="orderItem('لايكات إنستغرام ريلز', 0.25)" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 rounded-xl text-xs transition-all shadow-lg">
                        تنفيذ الطلب الفوري ↗
                    </button>
                </div>
            `;
        }

        // تنفيذ الطلب وخصم الرصيد الحقيقي داخل الـ Mini App
        function orderItem(serviceName, price) {
            let link = prompt("أدخل الرابط المطلوب (حساب أو منشور):");
            if (link) {
                let count = prompt("أدخل الكمية المطلوبة:", "1000");
                if (count) {
                    if (appData.balance < price) {
                        alert("عذراً، رصيدك غير كافي! يرجى شحن الرصيد أولاً.");
                        switchTab('wallet');
                        return;
                    }
                    appData.balance -= price;
                    updateUI();
                    
                    let orderId = '#' + Math.floor(Math.random() * 899999 + 100000);
                    appData.orders.unshift({
                        id: orderId,
                        service: serviceName + ` (${count})`,
                        status: "قيد التنفيذ",
                        time: "الآن"
                    });

                    tg.showAlert("تم إرسال الطلب بنجاح وبدء الرشق التلقائي!");
                    switchTab('orders');
                }
            }
        }

        // صفحة الطلبات النشطة
        function renderOrders() {
            let html = `<h2 class="font-bold text-sm mb-3">الطلبات النشطة والسابقة</h2>`;
            appData.orders.forEach(o => {
                html += `
                    <div class="custom-card p-4 rounded-xl mb-3 border-l-4 border-l-amber-500">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-amber-400">${o.id}</span>
                            <span class="text-[10px] bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded-full">${o.status}</span>
                        </div>
                        <p class="text-xs text-slate-200 font-medium">${o.service}</p>
                        <span class="text-[10px] text-slate-400 mt-2 block">${o.time}</span>
                    </div>
                `;
            });
            document.getElementById('appContent').innerHTML = html;
        }

        // صفحة شحن الرصيد (آسيا سيل، زين كاش، ماستر الرافدين)
        function renderWallet() {
            document.getElementById('appContent').innerHTML = `
                <h2 class="font-bold text-sm mb-3">شحن رصيد الحساب</h2>
                <div class="custom-card p-4 rounded-xl space-y-3">
                    <p class="text-xs text-slate-300">اختر طريقة الشحن المفضلة لديك:</p>
                    <div class="grid grid-cols-2 gap-2.5">
                        <button onclick="payMethod('رصيد آسيا سيل')" class="bg-slate-800/90 hover:bg-slate-700 p-3 rounded-xl border border-slate-700 text-xs font-bold text-right">
                            🏷️ رصيد آسيا سيل
                        </button>
                        <button onclick="payMethod('زين كاش العراق')" class="bg-slate-800/90 hover:bg-slate-700 p-3 rounded-xl border border-slate-700 text-xs font-bold text-right">
                            📱 زين كاش العراق
                        </button>
                        <button onclick="payMethod('ماستر كارد الرافدين')" class="bg-slate-800/90 hover:bg-slate-700 p-3 rounded-xl border border-slate-700 text-xs font-bold text-right">
                            💳 ماستر الرافدين
                        </button>
                        <button onclick="payMethod('تحويل USDT')" class="bg-slate-800/90 hover:bg-slate-700 p-3 rounded-xl border border-slate-700 text-xs font-bold text-right">
                            🪙 عملات رقمية USDT
                        </button>
                    </div>
                </div>
            `;
        }

        function payMethod(method) {
            let val = prompt(`أدخل القيمة المراد شحنها بالدولار عبر (${method}):`, "5");
            if (val) {
                let added = parseFloat(val);
                appData.balance += added;
                updateUI();
                alert(`تم بنجاح إضافة مبلغ $${added} إلى رصيدك عبر ${method}!`);
                switchTab('home');
            }
        }

        function renderNotifications() {
            document.getElementById('appContent').innerHTML = `
                <h2 class="font-bold text-sm mb-3">الإشعارات</h2>
                <div class="custom-card p-3.5 rounded-xl flex items-start gap-3">
                    <span class="text-lg">🔔</span>
                    <div>
                        <h4 class="font-bold text-xs text-slate-200">تنبيه النظام</h4>
                        <p class="text-[11px] text-slate-400 mt-0.5">تم تحديث واجهة المتجر ونظام الرشق ليعمل بصورة تفاعلية كاملة.</p>
                        <span class="text-[9px] text-slate-500 mt-1 block">الآن</span>
                    </div>
                </div>
            `;
        }

        function renderMore() {
            document.getElementById('appContent').innerHTML = `
                <h2 class="font-bold text-sm mb-3">القوائم والمزيد</h2>
                <div class="custom-card p-4 rounded-xl space-y-2 text-xs">
                    <div class="flex justify-between py-2 border-b border-slate-800">
                        <span>الدعم الفني</span>
                        <span class="text-amber-400 font-bold">@Support</span>
                    </div>
                    <div class="flex justify-between py-2">
                        <span>حالة الخادم</span>
                        <span class="text-emerald-400 font-bold">متصل 🟢</span>
                    </div>
                </div>
            `;
        }

        renderHome();
        updateUI();
    </script>
</body>
</html>
