<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رويال سوشال - متجر الرشق الملكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0712;
            color: #f3f0ff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 95px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        .purple-card {
            background: rgba(23, 15, 38, 0.75);
            border: 1px solid rgba(139, 92, 246, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .purple-gradient-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }

        .purple-gradient-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }

        /* أنيميشن الانبثاق والفتح المنسدل */
        .tab-anim {
            animation: fadeInSlide 0.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0, 1, 0, 1);
        }

        .accordion-content.open {
            max-height: 2000px;
            transition: max-height 0.5s ease-in-out;
        }

        .btn-hover-effect {
            transition: all 0.2s ease;
        }

        .btn-hover-effect:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-3">

    <!-- خلفية نيون مضيئة -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-72 h-72 bg-violet-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- بطاقة حساب المستخدم (الرصيد 0.00$) -->
    <div class="purple-card p-4 rounded-3xl mb-3 relative overflow-hidden">
        <div class="flex items-center justify-between mb-3 relative z-10">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 purple-gradient-btn rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-violet-500/30">
                    👑
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 id="userDisplayName" class="font-bold text-sm text-purple-100">مستخدم جديد</h1>
                        <span class="text-xs">🚩</span>
                    </div>
                    <span class="text-[10px] text-violet-300 font-mono bg-violet-500/10 px-2 py-0.5 rounded-full border border-violet-500/20">حساب فعال</span>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> متصل
            </span>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-purple-500/20 relative z-10">
            <div>
                <span class="block text-[10px] text-violet-300/70">الرصيد المتاح</span>
                <span id="userBalance" class="font-black text-violet-300 text-xl tracking-tight">$0.00</span>
            </div>
            <button onclick="switchTab('wallet')" class="purple-gradient-btn text-white font-bold text-xs py-2.5 px-5 rounded-2xl btn-hover-effect flex items-center gap-1.5">
                <span class="text-base">+</span>
                <span>شحن الرصيد</span>
            </button>
        </div>
    </div>

    <!-- محتوى الصفحات الديناميكي -->
    <div id="appContent" class="tab-anim"></div>

    <!-- النافذة المنبثقة للطلب (Modal) -->
    <div id="orderModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="purple-card w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 border-t border-violet-500/40 tab-anim">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="font-bold text-sm text-violet-300">تنفيذ طلب جديد</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-violet-950/60 text-violet-300 flex items-center justify-center text-xs hover:bg-violet-900">✕</button>
            </div>
            <div class="space-y-3.5">
                <div>
                    <label class="text-[11px] text-violet-300/80 block mb-1">رابط الحساب / المنشور:</label>
                    <input type="text" id="targetLink" placeholder="https://..." class="w-full bg-slate-950/80 border border-violet-500/30 p-3 rounded-2xl text-xs text-purple-100 focus:outline-none focus:border-violet-500">
                </div>
                <div>
                    <label class="text-[11px] text-violet-300/80 block mb-1">الكمية المطلوبة:</label>
                    <input type="number" id="targetQty" value="1000" oninput="calculateTotal()" class="w-full bg-slate-950/80 border border-violet-500/30 p-3 rounded-2xl text-xs text-purple-100 focus:outline-none focus:border-violet-500">
                </div>
                <div class="flex justify-between items-center py-2 px-1 text-xs border-y border-violet-500/15">
                    <span class="text-violet-300/70">التكلفة الإجمالية:</span>
                    <span id="totalPrice" class="font-extrabold text-violet-300 text-sm">$0.00</span>
                </div>
                <button onclick="confirmOrder()" class="w-full purple-gradient-btn text-white font-bold py-3 rounded-2xl text-xs btn-hover-effect">
                    تأكيد وإرسال الطلب 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 right-0 left-0 bg-[#0b0712]/90 border-t border-violet-500/20 backdrop-blur-2xl py-2 px-3 flex justify-between items-center text-[11px] text-violet-300/60 z-40">
        <button onclick="switchTab('more')" id="nav-more" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">☰</span>
            <span>المزيد</span>
        </button>
        <button onclick="switchTab('notifications')" id="nav-notifications" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">🔔</span>
            <span>الإشعارات</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">💳</span>
            <span>شحن</span>
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">📋</span>
            <span>طلباتي</span>
        </button>
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-violet-400 font-bold transition-all btn-hover-effect">
            <span class="text-lg">🏠</span>
            <span>الرئيسية</span>
        </button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentPricePerThousand = 0;
        let currentServiceName = "";

        let appData = {
            balance: 0.00,
            orders: []
        };

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userDisplayName').innerText = tg.initDataUnsafe.user.first_name;
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = '$' + appData.balance.toFixed(2);
        }

        function switchTab(tab) {
            document.querySelectorAll('nav button').forEach(b => b.className = "flex flex-col items-center gap-1 text-violet-300/60 transition-all btn-hover-effect");
            document.getElementById('nav-' + tab).className = "flex flex-col items-center gap-1 text-violet-400 font-bold transition-all btn-hover-effect";

            let content = document.getElementById('appContent');
            content.className = "";
            void content.offsetWidth;
            content.className = "tab-anim";

            if (tab === 'home') renderPlatforms();
            else if (tab === 'orders') renderOrders();
            else if (tab === 'wallet') renderWallet();
            else if (tab === 'notifications') renderNotifications();
            else if (tab === 'more') renderMore();
        }

        // 1. شبكة المنصات الرئيسية (مطابقة لصورة بيرفكت فولو)
        function renderPlatforms() {
            document.getElementById('appContent').innerHTML = `
                <!-- شريط البحث العلوي -->
                <div class="mb-3">
                    <input type="text" placeholder="ابحث بالاسم أو رقم الخدمة (ID)..." class="w-full bg-slate-950/80 border border-violet-500/20 p-3 rounded-2xl text-xs text-purple-100 placeholder-violet-300/40 focus:outline-none focus:border-violet-500">
                </div>

                <div class="flex justify-between items-center mb-2.5 px-1">
                    <h2 class="font-bold text-xs text-violet-300/80">المنصات المتاحة</h2>
                    <span class="text-[10px] text-violet-300/50">4 منصات</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <!-- إنستغرام -->
                    <div onclick="openPlatform('instagram')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 transition-all btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl p-2 bg-pink-500/10 rounded-xl">📸</span>
                            <span class="text-[9px] bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded-full">22 خدمة</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">إنستغرام</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">متابعين، لايكات، مشاهدات</p>
                        </div>
                    </div>

                    <!-- تليجرام -->
                    <div onclick="openPlatform('telegram')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 transition-all btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl p-2 bg-blue-500/10 rounded-xl">✈️</span>
                            <span class="text-[9px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full">50 خدمة</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">تليجرام</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">أعضاء، تفاعل، ستوري</p>
                        </div>
                    </div>

                    <!-- تيك توك -->
                    <div onclick="openPlatform('tiktok')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 transition-all btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl p-2 bg-purple-500/10 rounded-xl">🎵</span>
                            <span class="text-[9px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full">20 خدمة</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">تيك توك</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">متابعين، تكبيسات، بثوث</p>
                        </div>
                    </div>

                    <!-- خدمات مجانية -->
                    <div onclick="openPlatform('free')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 transition-all btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl p-2 bg-emerald-500/10 rounded-xl">🎁</span>
                            <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full">8 خدمات</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">خدمات مجانية</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">تجارب وهدايا يومية</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. عرض المنصات والأقسام القابلة للطوي والفتح المنسدل (مطابق تماماً للصور)
        function openPlatform(platform) {
            let html = `
                <div class="flex items-center gap-2 mb-3">
                    <button onclick="renderPlatforms()" class="bg-violet-950/60 border border-violet-500/30 px-3 py-1.5 rounded-xl text-xs text-violet-300 font-bold btn-hover-effect">⬅ رجوع للمنصات</button>
                    <h2 class="font-bold text-xs text-purple-100">فئات وخدمات ${platform === 'telegram' ? 'تليجرام' : platform === 'instagram' ? 'إنستغرام' : platform === 'tiktok' ? 'تيك توك' : 'الخدمات المجانية'}</h2>
                </div>
                <div class="space-y-2.5">
            `;

            if (platform === 'telegram') {
                html += `
                    <!-- فئة 1: تليجرام - مشاهدات ستوري -->
                    <div class="purple-card rounded-2xl overflow-hidden border border-violet-500/20">
                        <div onclick="toggleAccordion('tg-story')" class="p-3.5 cursor-pointer flex items-center justify-between bg-violet-950/20">
                            <div class="flex items-center gap-2.5">
                                <span class="text-lg">✈️</span>
                                <div>
                                    <h3 class="font-bold text-xs text-purple-100">تليجرام - مشاهدات ستوري</h3>
                                    <span class="text-[9px] text-violet-300/60">2 خدمة</span>
                                </div>
                            </div>
                            <span id="icon-tg-story" class="text-xs text-violet-300 transition-transform">🔽</span>
                        </div>
                        <div id="acc-tg-story" class="accordion-content p-3 space-y-2 bg-slate-950/40">
                            <div onclick="openOrderModal('مشاهدات ستوري تليجرام - سريع', 0.4050)" class="p-3 rounded-xl border border-violet-500/20 bg-violet-900/10 cursor-pointer flex justify-between items-center btn-hover-effect">
                                <div>
                                    <h4 class="font-bold text-xs text-purple-100">مشاهدات ستوري تليجرام - سريع</h4>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">⏱️ غضون 3 دقائق</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-bold text-xs text-violet-300">$0.4050</span>
                                    <span class="block text-[8px] text-violet-300/50">لكل 1000</span>
                                </div>
                            </div>
                            <div onclick="openOrderModal('مشاهدات ستوري تليجرام - الأكثر طلباً', 0.2025)" class="p-3 rounded-xl border border-violet-500/20 bg-violet-900/10 cursor-pointer flex justify-between items-center btn-hover-effect">
                                <div>
                                    <h4 class="font-bold text-xs text-purple-100">مشاهدات ستوري تليجرام - عالي السرعة</h4>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">⏱️ غضون دقيقتين</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-bold text-xs text-violet-300">$0.2025</span>
                                    <span class="block text-[8px] text-violet-300/50">لكل 1000</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- فئة 2: أعضاء تليجرام مميزين - بريميوم -->
                    <div class="purple-card rounded-2xl overflow-hidden border border-violet-500/20">
                        <div onclick="toggleAccordion('tg-premium')" class="p-3.5 cursor-pointer flex items-center justify-between bg-violet-950/20">
                            <div class="flex items-center gap-2.5">
                                <span class="text-lg">⭐</span>
                                <div>
                                    <h3 class="font-bold text-xs text-purple-100">أعضاء تليجرام مميزين - بريميوم</h3>
                                    <span class="text-[9px] text-violet-300/60">3 خدمة</span>
                                </div>
                            </div>
                            <span id="icon-tg-premium" class="text-xs text-violet-300 transition-transform">🔽</span>
                        </div>
                        <div id="acc-tg-premium" class="accordion-content p-3 space-y-2 bg-slate-950/40">
                            <div onclick="openOrderModal('أعضاء تليجرام بريميوم ضمان 15 يوم', 4.2750)" class="p-3 rounded-xl border border-violet-500/20 bg-violet-900/10 cursor-pointer flex justify-between items-center btn-hover-effect">
                                <div>
                                    <h4 class="font-bold text-xs text-purple-100">أعضاء بريميوم ضمان 15 يوم</h4>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">⏱️ غضون 43 دقيقة</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-bold text-xs text-violet-300">$4.2750</span>
                                    <span class="block text-[8px] text-violet-300/50">لكل 1000</span>
                                </div>
                            </div>
                            <div onclick="openOrderModal('أعضاء بريميوم ضمان 30-60 يوم', 8.7750)" class="p-3 rounded-xl border border-violet-500/20 bg-violet-900/10 cursor-pointer flex justify-between items-center btn-hover-effect">
                                <div>
                                    <h4 class="font-bold text-xs text-purple-100">أعضاء بريميوم ضمان 30-60 يوم</h4>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">⏱️ غضون 29 دقيقة</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-bold text-xs text-violet-300">$8.7750</span>
                                    <span class="block text-[8px] text-violet-300/50">لكل 1000</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- فئة 3: تفاعلات ري أكشن للمنشور -->
                    <div class="purple-card rounded-2xl overflow-hidden border border-violet-500/20">
                        <div onclick="toggleAccordion('tg-reactions')" class="p-3.5 cursor-pointer flex items-center justify-between bg-violet-950/20">
                            <div class="flex items-center gap-2.5">
                                <span class="text-lg">🔥</span>
                                <div>
                                    <h3 class="font-bold text-xs text-purple-100">تليجرام | تفاعلات (ري أكشن)</h3>
                                    <span class="text-[9px] text-violet-300/60">13 خدمة</span>
                                </div>
                            </div>
                            <span id="icon-tg-reactions" class="text-xs text-violet-300 transition-transform">🔽</span>
                        </div>
                        <div id="acc-tg-reactions" class="accordion-content p-3 space-y-2 bg-slate-950/40">
                            <div onclick="openOrderModal('تليجرام - تفاعلات إيجابية 👍❤️🔥', 0.0184)" class="p-3 rounded-xl border border-violet-500/20 bg-violet-900/10 cursor-pointer flex justify-between items-center btn-hover-effect">
                                <div>
                                    <h4 class="font-bold text-xs text-purple-100">تفاعلات رموز إيجابية 👍❤️</h4>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">⏱️ غضون 17 دقيقة</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-bold text-xs text-violet-300">$0.0184</span>
                                    <span class="block text-[8px] text-violet-300/50">لكل 1000</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (platform === 'tiktok') {
                html += `
                    <!-- فئة تيك توك: تكبيسات لايف -->
                    <div class="purple-card rounded-2xl overflow-hidden border border-violet-500/20">
                        <div onclick="toggleAccordion('tt-live')" class="p-3.5 cursor-pointer flex items-center justify-between bg-violet-950/20">
                            <div class="flex items-center gap-2.5">
                                <span class="text-lg">🎯</span>
                                <div>
                                    <h3 class="font-bold text-xs text-purple-100">تكبيسات بث مباشر تيك توك</h3>
                                    <span class="text-[9px] text-violet-300/60">3 خدمة</span>
                                </div>
                            </div>
                            <span id="icon-tt-live" class="text-xs text-violet-300 transition-transform">🔽</span>
                        </div>
                        <div id="acc-tt-live" class="accordion-content p-3 space-y-2 bg-slate-950/40">
                            <div onclick="openOrderModal('تكبيس لايف تيك توك فوري', 0.0312)" class="p-3 rounded-xl border border-violet-500/20 bg-violet-900/10 cursor-pointer flex justify-between items-center btn-hover-effect">
                                <div>
                                    <h4 class="font-bold text-xs text-purple-100">تكبيس لايف تيك توك - فوري وسريع</h4>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded">⏱️ غضون 7 دقائق</span>
                                </div>
                                <div class="text-left">
                                    <span class="font-bold text-xs text-violet-300">$0.0312</span>
                                    <span class="block text-[8px] text-violet-300/50">لكل 1000</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="p-6 text-center text-xs text-violet-300/50">اختر منصة تليجرام أو تيك توك لعرض الخدمات والتفاصيل الشاملة.</div>
                `;
            }

            html += `</div>`;
            document.getElementById('appContent').innerHTML = html;
        }

        // دالة الفتح والطوي المنسدل (Accordion Toggle)
        function toggleAccordion(id) {
            let content = document.getElementById('acc-' + id);
            let icon = document.getElementById('icon-' + id);
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.style.transform = 'rotate(0deg)';
            } else {
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
            }
        }

        function openOrderModal(serviceName, price) {
            currentServiceName = serviceName;
            currentPricePerThousand = price;
            document.getElementById('modalTitle').innerText = serviceName;
            document.getElementById('targetLink').value = "";
            document.getElementById('targetQty').value = "1000";
            calculateTotal();
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        function calculateTotal() {
            let qty = parseFloat(document.getElementById('targetQty').value) || 0;
            let total = (qty / 1000) * currentPricePerThousand;
            document.getElementById('totalPrice').innerText = '$' + total.toFixed(4);
        }

        function confirmOrder() {
            let link = document.getElementById('targetLink').value;
            let qty = parseFloat(document.getElementById('targetQty').value) || 0;
            let totalCost = (qty / 1000) * currentPricePerThousand;

            if (!link || link.length < 5) {
                alert("يرجى إدخال رابط صحيح!");
                return;
            }

            if (appData.balance < totalCost) {
                alert("عذراً، رصيدك غير كافي! يرجى شحن الحساب أولاً.");
                closeModal();
                switchTab('wallet');
                return;
            }

            appData.balance -= totalCost;
            updateBalanceUI();

            let orderId = "#" + Math.floor(Math.random() * 899999 + 100000);
            appData.orders.unshift({
                id: orderId,
                service: currentServiceName + ` (${qty})`,
                status: "قيد التنفيذ ⏳",
                time: "الآن"
            });

            if (tg.sendData) {
                tg.sendData(JSON.stringify({
                    order: orderId,
                    service: currentServiceName,
                    link: link,
                    qty: qty,
                    cost: totalCost
                }));
            }

            closeModal();
            tg.showAlert(`✅ تم إرسال الطلب بنجاح! رقم الطلب: ${orderId}`);
            switchTab('orders');
        }

        function renderOrders() {
            let html = `<h2 class="font-bold text-xs text-violet-300/70 mb-3 tracking-wider">سجل طلباتي 📋</h2>`;

                html += `<div class="purple-card p-8 text-center rounded-3xl text-xs text-violet-300/50">لا توجد طلبات سابقة.</div>`;
