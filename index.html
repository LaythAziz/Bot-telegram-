<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>رويال سوشال - متجر الرشق الملكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0712;
            color: #f3f0ff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding-bottom: 95px;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .purple-card {
            background: rgba(23, 15, 38, 0.75);
            border: 1px solid rgba(139, 92, 246, 0.22);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .purple-gradient-btn {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
        }

        .purple-gradient-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* سلاسة الحركة للانتقالات - 120Hz Refresh Rate */
        .tab-anim {
            will-change: transform, opacity;
            animation: fadeInSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.985);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .btn-hover-effect {
            transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.15s ease;
        }

        .btn-hover-effect:active {
            transform: scale(0.96);
        }

        /* تحسين مظهر الصور والأيقونات */
        .platform-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .platform-icon-lg {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-3">

    <!-- خلفية نيون بنفسجية مضيئة -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-72 h-72 bg-violet-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- الهيدر العلوي الملكي -->
    <div class="purple-card p-4 rounded-3xl mb-3 relative overflow-hidden">
        <div class="flex items-center justify-between mb-3 relative z-10">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 purple-gradient-btn rounded-2xl flex items-center justify-center font-black text-2xl text-white shadow-lg shadow-violet-500/30">
                    👑
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 id="userDisplayName" class="font-bold text-sm text-purple-100">مستخدم جديد</h1>
                        <span class="text-xs">🚩</span>
                    </div>
                    <span class="text-[10px] text-violet-300 font-mono bg-violet-500/10 px-2 py-0.5 rounded-full border border-violet-500/20">حساب فعال</span>
                </div>
            </div>
            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full font-bold flex items-center gap-1">
                <span class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span> متصل
            </span>
        </div>

        <div class="flex items-center justify-between pt-3 border-t border-purple-500/20 relative z-10">
            <div>
                <span class="block text-[10px] text-violet-300/70">الرصيد المتاح</span>
                <span id="userBalance" class="font-black text-violet-300 text-xl tracking-tight">$0.0000</span>
            </div>
            <button onclick="switchTab('wallet')" class="purple-gradient-btn text-white font-bold text-xs py-2.5 px-5 rounded-2xl btn-hover-effect flex items-center gap-1.5">
                <span class="text-base">+</span>
                <span>شحن الرصيد</span>
            </button>
        </div>
    </div>

    <!-- محتوى الصفحات المتغير -->
    <div id="appContent" class="tab-anim"></div>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 right-0 left-0 bg-[#0b0712]/92 border-t border-violet-500/20 backdrop-blur-2xl py-2 px-3 flex justify-between items-center text-[11px] text-violet-300/60 z-40">
        <button onclick="switchTab('more')" id="nav-more" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">☰</span>
            <span>المزيد</span>
        </button>
        <button onclick="switchTab('notifications')" id="nav-notifications" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">🔔</span>
            <span>الإشعارات</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">💳</span>
            <span>شحن</span>
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center gap-1 transition-all btn-hover-effect">
            <span class="text-lg">📋</span>
            <span>طلباتي</span>
        </button>
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-violet-400 font-bold transition-all btn-hover-effect">
            <span class="text-lg">🏠</span>
            <span>الرئيسية</span>
        </button>
    </nav>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // روابط صور الشعارات الرسمية عالية الجودة
        const PLATFORM_IMAGES = {
            instagram: "https://png.pngtree.com/png-vector/20221018/ourmid/pngtree-instagram-icon-png-image_6315974.png",
            telegram: "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/3840px-Telegram_logo.svg.png",
            tiktok: "https://images.seeklogo.com/logo-png/37/1/tiktok-app-icon-logo-png_seeklogo-373800.png",
            free: "https://cdn-icons-png.flaticon.com/512/3702/3702999.png"
        };

        let appData = {
            balance: 0.00,
            orders: []
        };

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('userDisplayName').innerText = tg.initDataUnsafe.user.first_name;
        }

        function updateBalanceUI() {
            document.getElementById('userBalance').innerText = '$' + appData.balance.toFixed(4);
        }

        function switchTab(tab) {
            document.querySelectorAll('nav button').forEach(b => b.className = "flex flex-col items-center gap-1 text-violet-300/60 transition-all btn-hover-effect");
            document.getElementById('nav-' + tab).className = "flex flex-col items-center gap-1 text-violet-400 font-bold transition-all btn-hover-effect";

            let content = document.getElementById('appContent');
            content.className = "";
            void content.offsetWidth;
            content.className = "tab-anim";

            if (tab === 'home') renderPlatforms();
            else if (tab === 'orders') renderOrders();
            else if (tab === 'wallet') renderWallet();
            else if (tab === 'notifications') renderNotifications();
            else if (tab === 'more') renderMore();
        }

        const servicesData = {
            free: [
                { id: "800", name: "مشاهدات ستوري انستغرام لجميع الاستوريات - بطيء", img: PLATFORM_IMAGES.instagram, category: "أنستغرام - مجانية", price: 0.00, min: 500, max: 500, speed: "242د", timeBadge: "4 س", badge: "الأعلى اكتمالاً" },
                { id: "801", name: "لايكات إنستغرام ريلز + بوست مجانية", img: PLATFORM_IMAGES.instagram, category: "أنستغرام - مجانية", price: 0.00, min: 100, max: 500, speed: "15د", timeBadge: "15 د", badge: "مجاني فوري" },
                { id: "802", name: "مشاهدات فيديو تيك توك مجانية", img: PLATFORM_IMAGES.tiktok, category: "تيك توك - مجانية", price: 0.00, min: 1000, max: 1000, speed: "10د", timeBadge: "10 د", badge: "مجاني" },
                { id: "803", name: "تفاعلات تليجرام إيجابية مجانية 👍🔥", img: PLATFORM_IMAGES.telegram, category: "تليجرام - مجانية", price: 0.00, min: 50, max: 200, speed: "30د", timeBadge: "30 د", badge: "تفاعل مجاني" }
            ],
            instagram: [
                { id: "101", name: "متابعين انستغرام حقيقي - ضمان تعويض 30 يوم", img: PLATFORM_IMAGES.instagram, category: "إنستغرام", price: 0.5000, min: 100, max: 50000, speed: "44د", timeBadge: "غضون ساعة", badge: "الأكثر طلباً" },
                { id: "102", name: "لايكات إنستغرام ريلز + بوست - سرعة فائقة", img: PLATFORM_IMAGES.instagram, category: "إنستغرام", price: 0.1800, min: 50, max: 100000, speed: "12د", timeBadge: "30 دقيقة", badge: "فوري" },
                { id: "103", name: "مشاهدات ريلز وانستغرام فوري جداً", img: PLATFORM_IMAGES.instagram, category: "إنستغرام", price: 0.0250, min: 100, max: 1000000, speed: "5د", timeBadge: "15 دقيقة", badge: "أرخص سعر" }
            ],
            telegram: [
                { id: "637", name: "مشاهدات ستوري تليجرام - سريع", img: PLATFORM_IMAGES.telegram, category: "تليجرام", price: 0.4050, min: 15, max: 150000, speed: "3د", timeBadge: "3 دقائق", badge: "سريع" },
                { id: "638", name: "مشاهدات ستوري تليجرام - عالي الجودة", img: PLATFORM_IMAGES.telegram, category: "تليجرام", price: 0.2025, min: 10, max: 5000, speed: "2د", timeBadge: "2 دقيقة", badge: "الأكثر طلباً" },
                { id: "751", name: "أعضاء تليجرام بريميوم ضمان 15 يوم", img: PLATFORM_IMAGES.telegram, category: "تليجرام", price: 4.2750, min: 500, max: 50000, speed: "43د", timeBadge: "43 دقيقة", badge: "تعويض 15 يوم" },
                { id: "752", name: "أعضاء تليجرام بريميوم ضمان 30-60 يوم", img: PLATFORM_IMAGES.telegram, category: "تليجرام", price: 8.7750, min: 100, max: 50000, speed: "29د", timeBadge: "29 دقيقة", badge: "تعويض 30 يوم" },
                { id: "761", name: "تليجرام - تفاعلات رموز إيجابية 👍❤️", img: PLATFORM_IMAGES.telegram, category: "تليجرام", price: 0.1013, min: 10, max: 1000000, speed: "1د", timeBadge: "1 دقيقة", badge: "الأعلى اكتمالاً" }
            ],
            tiktok: [
                { id: "836", name: "تكبيس لايف تيك توك - لايكات فورية وسريعة", img: PLATFORM_IMAGES.tiktok, category: "تيك توك", price: 0.0312, min: 100, max: 2147483647, speed: "7د", timeBadge: "7 دقائق", badge: "الأكثر طلباً" },
                { id: "874", name: "مشاهدات فيديو تيك توك بدون ضمان", img: PLATFORM_IMAGES.tiktok, category: "تيك توك", price: 0.0208, min: 100, max: 999999999, speed: "9د", timeBadge: "9 دقائق", badge: "سريع" }
            ]
        };

        // 1. شبكة المنصات الرئيسية مع صور الشعارات الرسمية
        function renderPlatforms() {
            document.getElementById('appContent').innerHTML = `
                <div class="mb-3">
                    <input type="text" placeholder="ابحث بالاسم أو رقم الخدمة (ID)..." class="w-full bg-slate-950/80 border border-violet-500/20 p-3 rounded-2xl text-xs text-purple-100 placeholder-violet-300/40 focus:outline-none focus:border-violet-500">
                </div>

                <div class="flex justify-between items-center mb-2.5 px-1">
                    <h2 class="font-bold text-xs text-violet-300/80">المنصات والخدمات المتاحة</h2>
                    <span class="text-[10px] text-violet-300/50">4 منصات</span>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <!-- كارت الخدمات المجانية -->
                    <div onclick="openPlatform('free')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-3">
                            <img src="${PLATFORM_IMAGES.free}" alt="Free" class="platform-icon-lg">
                            <span class="text-[9px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-bold">4 خدمات</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">خدمات مجانية</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">تجارب وهدايا $0.00</p>
                        </div>
                    </div>

                    <!-- كارت إنستغرام -->
                    <div onclick="openPlatform('instagram')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-3">
                            <img src="${PLATFORM_IMAGES.instagram}" alt="Instagram" class="platform-icon-lg">
                            <span class="text-[9px] bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded-full font-bold">22 خدمة</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">إنستغرام</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">متابعين، لايكات، ريلز</p>
                        </div>
                    </div>

                    <!-- كارت تليجرام -->
                    <div onclick="openPlatform('telegram')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-3">
                            <img src="${PLATFORM_IMAGES.telegram}" alt="Telegram" class="platform-icon-lg">
                            <span class="text-[9px] bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded-full font-bold">50 خدمة</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">تليجرام</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">أعضاء، تفاعل، ستوري</p>
                        </div>
                    </div>

                    <!-- كارت تيك توك -->
                    <div onclick="openPlatform('tiktok')" class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 btn-hover-effect flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-3">
                            <img src="${PLATFORM_IMAGES.tiktok}" alt="TikTok" class="platform-icon-lg">
                            <span class="text-[9px] bg-purple-500/20 text-purple-300 px-2 py-0.5 rounded-full font-bold">20 خدمة</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs text-purple-100">تيك توك</h3>
                            <p class="text-[9px] text-violet-300/60 mt-0.5">متابعين، تكبيسات، مشاهدات</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. قائمة خدمات المنصة مع صور الشعارات
        function openPlatform(platformKey) {
            let list = servicesData[platformKey] || [];
            let html = `
                <div class="flex items-center gap-2 mb-3">
                    <button onclick="renderPlatforms()" class="bg-violet-950/60 border border-violet-500/30 px-3 py-1.5 rounded-xl text-xs text-violet-300 font-bold btn-hover-effect">⬅ رجوع</button>
                    <h2 class="font-bold text-xs text-purple-100">قائمة خدمات المنصة</h2>
                </div>
                <div class="space-y-2.5">
            `;

            list.forEach(item => {
                html += `
                    <div onclick='openServiceDetails(${JSON.stringify(item)})' class="purple-card p-3.5 rounded-2xl cursor-pointer hover:border-violet-500/60 btn-hover-effect flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <img src="${item.img}" class="platform-icon">
                            <div>
                                <h3 class="font-bold text-xs text-purple-100">${item.name}</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] text-violet-300 font-bold">$${item.price.toFixed(4)} <span class="font-normal text-violet-300/60">/1000</span></span>
                                    <span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.2 rounded font-bold">⏱️ ${item.timeBadge}</span>
                                </div>
                            </div>
                        </div>
                        <span class="text-xs text-violet-300/60">طلب ↗</span>
                    </div>
                `;
            });

            html += `</div>`;
            document.getElementById('appContent').innerHTML = html;
        }

        // 3. صفحة تفاصيل الخدمة مع صورة شعار المنصة بداخل الهيدر
        function openServiceDetails(item) {
            let content = document.getElementById('appContent');
            content.className = "";
            void content.offsetWidth;
            content.className = "tab-anim";

            content.innerHTML = `
                <div class="flex items-center gap-2 mb-3">
                    <button onclick="renderPlatforms()" class="bg-violet-950/60 border border-violet-500/30 px-3 py-1.5 rounded-xl text-xs text-violet-300 font-bold btn-hover-effect">⬅ إغلاق / رجوع</button>
                </div>

                <!-- بطاقة الخدمة بالصور -->
                <div class="purple-card p-4 rounded-3xl mb-3">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-violet-300/70 font-mono">#${item.id}</span>
                            <span class="text-[10px] text-violet-300/50">• ${item.category}</span>
                        </div>
                        <img src="${item.img}" class="platform-icon-lg">
                    </div>
                    <h2 class="font-bold text-sm text-purple-100 mb-3">${item.name}</h2>

                    <!-- جدول الأدنى / الأقصى / السعر / التنفيذ -->
                    <div class="grid grid-cols-4 gap-1 bg-slate-950/80 p-2.5 rounded-2xl text-center border border-violet-500/20 mb-3">
                        <div>
                            <span class="block text-[9px] text-violet-300/60">الأدنى</span>
                            <span class="font-bold text-xs text-purple-100">${item.min}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] text-violet-300/60">الأقصى</span>
                            <span class="font-bold text-xs text-purple-100">${item.max}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] text-violet-300/60">1000/</span>
                            <span class="font-bold text-xs text-violet-300">$${item.price.toFixed(4)}</span>
                        </div>
                        <div>
                            <span class="block text-[9px] text-violet-300/60">التنفيذ</span>
                            <span class="font-bold text-xs text-purple-100">د${item.speed}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-1.5 text-[10px] text-emerald-400 font-bold bg-emerald-500/10 p-2 rounded-xl border border-emerald-500/20">
                        <span>⏱️ ${item.timeBadge}</span>
                        <span class="bg-emerald-500/20 px-2 py-0.5 rounded-md ml-auto">${item.badge}</span>
                    </div>
                </div>

                <!-- تنبيه -->
                <div class="purple-card p-3.5 rounded-2xl mb-3 text-[11px] text-violet-300/80 space-y-1">
                    <p class="font-bold text-amber-400 flex items-center gap-1">ℹ️ ادخل رابط حسابك أو اليوزر فقط</p>
                    <p class="text-[10px] text-violet-300/60">لازم يكون حسابك عام وليس خاص لضمان وصول الخدمة.</p>
                </div>

                <!-- حقول الإدخال -->
                <div class="purple-card p-4 rounded-3xl space-y-3.5 mb-3">
                    <div>
                        <label class="text-[11px] font-bold text-purple-100 block mb-1.5 flex items-center gap-1">
                            <span class="text-amber-400">•</span> رابط الحساب أو اسم المستخدم
                        </label>
                        <div class="relative">
                            <input type="text" id="serviceLink" placeholder="https://..." class="w-full bg-slate-950/80 border border-violet-500/30 p-3 rounded-2xl text-xs text-purple-100 focus:outline-none focus:border-violet-500">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-violet-300/40 text-sm">🔗</span>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-[11px] font-bold text-purple-100 flex items-center gap-1">
                                <span class="text-amber-400">•</span> الكمية المطلوبة
                            </label>
                            <span class="text-[9px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-mono">${item.min} - ${item.max}</span>
                        </div>
                        <div class="relative">
                            <input type="number" id="serviceQty" value="${item.min}" min="${item.min}" max="${item.max}" oninput="calcOrderCost(${item.price})" class="w-full bg-slate-950/80 border border-violet-500/30 p-3 rounded-2xl text-xs text-purple-100 focus:outline-none focus:border-violet-500">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-violet-300/40 font-mono text-xs">#</span>
                        </div>
                    </div>
                </div>

                <!-- ملخص الطلب -->
                <div class="purple-card p-4 rounded-3xl space-y-3 mb-4">
                    <h3 class="text-xs font-bold text-amber-400 flex items-center gap-1">💲 ملخص الطلب</h3>
                    <div class="grid grid-cols-2 gap-2.5">
                        <div class="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-2xl text-center">
                            <span class="block text-[10px] text-emerald-300/70 mb-0.5">التكلفة</span>
                            <span id="orderCostDisplay" class="font-black text-emerald-400 text-sm">$0.0000</span>
                        </div>
                        <div class="bg-amber-950/30 border border-amber-500/30 p-3 rounded-2xl text-center">
                            <span class="block text-[10px] text-amber-300/70 mb-0.5">رصيدك</span>
                            <span class="font-black text-amber-400 text-sm">$${appData.balance.toFixed(4)}</span>
                        </div>
                    </div>

                    <button onclick="submitFinalOrder('${item.name}', ${item.price})" class="w-full purple-gradient-btn text-white font-bold py-3.5 rounded-2xl text-xs btn-hover-effect shadow-xl flex items-center justify-center gap-2">
                        <span>إرسال الطلب</span>
                        <span>📐</span>
                    </button>
                </div>
            `;
            calcOrderCost(item.price);
        }

        function calcOrderCost(pricePerThousand) {
            let qtyInput = document.getElementById('serviceQty');
            if (!qtyInput) return;
            let qty = parseFloat(qtyInput.value) || 0;
            let totalCost = (qty / 1000) * pricePerThousand;
            document.getElementById('orderCostDisplay').innerText = '$' + totalCost.toFixed(4);
        }

        function submitFinalOrder(serviceName, pricePerThousand) {
            let link = document.getElementById('serviceLink').value;
            let qty = parseFloat(document.getElementById('serviceQty').value) || 0;
            let totalCost = (qty / 1000) * pricePerThousand;

            if (!link || link.length < 3) {
                alert("يرجى إدخال رابط أو اسم مستخدم صحيح!");
                return;
            }

            if (appData.balance < totalCost) {
                alert("عذراً، رصيدك غير كافي! يرجى شحن الرصيد أولاً.");
                switchTab('wallet');
                return;
            }

            appData.balance -= totalCost;
            updateBalanceUI();

            let orderId = "#" + Math.floor(Math.random() * 899999 + 100000);
            appData.orders.unshift({
                id: orderId,
                service: serviceName + ` (${qty})`,
                status: "قيد التنفيذ ⏳",
                time: "الآن"
            });

            if (tg.sendData) {
                tg.sendData(JSON.stringify({
                    order: orderId,
                    service: serviceName,
                    link: link,
                    qty: qty,
                    cost: totalCost
                }));
            }

            tg.showAlert(`✅ تم إرسال الطلب بنجاح! رقم الطلب: ${orderId}`);
            switchTab('orders');
        }

                        </div>
                        <p class="text-[11px] text-violet-300/80 mb-2">حول المبلغ إلى رقم البطاقة الموضح بالأسفل:</p>

                return;

        function renderOrders() {
            let html = `<h2 class="font-bold text-xs text-violet-300/70 mb-3 tracking-wider">سجل طلباتي 📋</h2>`;

        renderPlatforms();
